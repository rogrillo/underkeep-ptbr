name: Python tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  linux:
    # Steam Deck/SteamOS é Linux: aqui rodam também os testes que dependem de links simbólicos, de
    # /proc e de extrair o pacote com unzip (permissão de execução do launcher).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -rs
